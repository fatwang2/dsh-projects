<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- One goal: a target on a card. -->
  <rect x="48" y="108" width="104" height="84" rx="16" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
  <circle cx="100" cy="150" r="24" fill="#e4edf8"/>
  <circle cx="100" cy="150" r="16" fill="#247bbf"/>
  <circle cx="100" cy="150" r="7" fill="#ffffff"/>

  <!-- The goal fans out into three parallel tasks. -->
  <g fill="none" stroke="#7b8b9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M152 150h32q8 0 8-8V94q0-8 8-8h32"/>
    <path d="M152 150h80"/>
    <path d="M152 150h32q8 0 8 8v48q0 8 8 8h32"/>
    <path d="M224 80l8 6-8 6"/>
    <path d="M224 144l8 6-8 6"/>
    <path d="M224 208l8 6-8 6"/>
  </g>

  <!-- Three tasks, each with a status dot, a title, a summary and a finished result bar. -->
  <g>
    <rect x="240" y="58" width="152" height="56" rx="14" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
    <circle cx="260" cy="86" r="7" fill="#1f8a5b"/>
    <rect x="276" y="72" width="96" height="7" rx="3.5" fill="#d6dde7"/>
    <rect x="276" y="84" width="64" height="6" rx="3" fill="#e0e5ed"/>
    <rect x="276" y="97" width="96" height="5" rx="2.5" fill="#1f8a5b"/>

    <rect x="240" y="122" width="152" height="56" rx="14" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
    <circle cx="260" cy="150" r="7" fill="#1f8a5b"/>
    <rect x="276" y="136" width="84" height="7" rx="3.5" fill="#d6dde7"/>
    <rect x="276" y="148" width="76" height="6" rx="3" fill="#e0e5ed"/>
    <rect x="276" y="161" width="96" height="5" rx="2.5" fill="#1f8a5b"/>

    <rect x="240" y="186" width="152" height="56" rx="14" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
    <circle cx="260" cy="214" r="7" fill="#1f8a5b"/>
    <rect x="276" y="200" width="72" height="7" rx="3.5" fill="#d6dde7"/>
    <rect x="276" y="212" width="56" height="6" rx="3" fill="#e0e5ed"/>
    <rect x="276" y="225" width="96" height="5" rx="2.5" fill="#1f8a5b"/>
  </g>

  <!-- Results merge and go to a person for acceptance. -->
  <g fill="none" stroke="#7b8b9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392 86h32q8 0 8 8v48q0 8 8 8"/>
    <path d="M392 150h48"/>
    <path d="M392 214h32q8 0 8-8v-48q0-8 8-8"/>
    <path d="M440 150h56"/>
    <path d="M488 144l8 6-8 6"/>
  </g>

  <!-- The reviewer: a person with a check badge. -->
  <circle cx="536" cy="140" r="36" fill="#e4edf8"/>
  <circle cx="536" cy="127" r="12" fill="#247bbf"/>
  <path d="M512 164c0-13.3 10.7-24 24-24s24 10.7 24 24z" fill="#247bbf"/>
  <circle cx="562" cy="164" r="18" fill="#f3f5f9"/>
  <circle cx="562" cy="164" r="14" fill="#1f8a5b"/>
  <path d="M555 164l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
