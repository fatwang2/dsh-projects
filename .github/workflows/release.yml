name: Release

# Publish to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#   # or: git tag v0.2.3 && git push origin v0.2.3
#
# The version comes from package.json; the tag must be v<version> or the run fails.
# Authentication uses npm trusted publishing (OIDC), so no token is stored in this repo.
# One-time setup on npmjs.com: package settings -> Trusted publisher -> GitHub Actions,
# user fatwang2, repository dsh-projects, workflow release.yml, environment npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@fatwang2/dsh-projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.6, which is required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Install dependencies when a lockfile exists
        # This package has no dependencies yet, so there is no package-lock.json.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json; nothing to install"
          fi
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish to npm
        # Skips a version that is already on npm, e.g. a release published by hand.
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@fatwang2/dsh-projects@${version}" version >/dev/null 2>&1; then
            echo "@fatwang2/dsh-projects@${version} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
